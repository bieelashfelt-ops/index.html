<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VN Studio - Modo Criação</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#111827;--line:#334155;--purple:#7c3aed;--text:#f8fafc;--muted:#94a3b8}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button{border:0;border-radius:10px;padding:11px 14px;background:var(--purple);color:white;font-weight:700;cursor:pointer}
button.secondary{background:#334155}
button.danger{background:#b91c1c}
input,textarea,select{width:100%;padding:11px;border:1px solid #475569;border-radius:9px;background:#0b1220;color:white;margin-top:6px}
textarea{min-height:100px;resize:vertical}
header{height:64px;padding:10px 14px;background:#111827;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:20px;font-weight:800}.top{display:flex;gap:8px;flex-wrap:wrap}
main{display:grid;grid-template-columns:210px minmax(0,1fr) 280px;min-height:calc(100vh - 64px)}
.panel{background:var(--panel);padding:14px;overflow:auto}
.center{padding:14px;min-width:0}
h2,h3{margin:4px 0 12px}.muted{color:var(--muted);font-size:13px}
.scene{padding:12px;border:1px solid var(--line);border-radius:10px;background:#182235;margin-bottom:8px;cursor:pointer}
.scene.active{background:#6d28d9;border-color:#a78bfa}
.stack{display:grid;gap:9px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.stage{position:relative;aspect-ratio:16/9;min-height:300px;background:#020617 center/cover no-repeat;border-radius:14px;overflow:hidden;border:1px solid #475569}
.stage .char{position:absolute;bottom:0;max-height:82%;max-width:38%;object-fit:contain;transform:translateX(-50%)}
.stage .left{left:22%}.stage .centerPos{left:50%}.stage .right{left:78%}
.dialogBox{position:absolute;left:4%;right:4%;bottom:4%;padding:14px 16px;border-radius:12px;background:rgba(0,0,0,.78);backdrop-filter:blur(4px)}
.dialogBox b{color:#c4b5fd}
.toolGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.item{padding:10px;border-radius:9px;background:#111827;border:1px solid var(--line)}
.hidden{display:none!important}
.file{background:#334155;padding:10px;border-radius:9px;text-align:center;cursor:pointer}
.file input{display:none}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
@media(max-width:900px){
 main{grid-template-columns:1fr}
 .panel{max-height:none}
 .stage{min-height:220px}
}
</style>
</head>
<body>

<header>
  <div class="logo">🎬 VN Studio <span class="muted">• Modo Criação</span></div>
  <div class="top">
    <button onclick="newProject()">Novo</button>
    <button onclick="saveProject()">Salvar</button>
    <button onclick="testProject()">▶ Testar</button>
  </div>
</header>

<main>
<aside class="panel">
  <h3>Projeto</h3>
  <label>Nome</label>
  <input id="projectName" oninput="project.name=this.value">
  <hr>
  <h3>Cenas</h3>
  <button style="width:100%" onclick="addScene()">+ Nova cena</button>
  <div id="sceneList" style="margin-top:10px"></div>
</aside>

<section class="center">
  <div class="card">
    <h2 id="sceneTitle">Cena 1</h2>
    <div class="muted">Monte a cena. O VN Studio fornece as ferramentas; a história é sua.</div>
  </div>

  <div id="stage" class="stage"></div>

  <div class="card">
    <h3>Ferramentas da cena</h3>
    <div class="toolGrid">
      <label class="file">🖼️ Fundo
        <input id="bgFile" type="file" accept="image/*" onchange="loadBackground(this)">
      </label>
      <label class="file">👤 Personagem
        <input id="charFile" type="file" accept="image/*" onchange="loadCharacter(this)">
      </label>
      <button onclick="addDialogue()">💬 Novo diálogo</button>
      <button class="danger" onclick="deleteScene()">🗑️ Excluir cena</button>
    </div>
  </div>

  <div class="card">
    <h3>Roteiro da cena</h3>
    <div id="dialogList"></div>
  </div>
</section>

<aside class="panel">
  <h3>Inspector</h3>
  <div id="inspector"></div>
</aside>
</main>

<script>
const KEY="vn_studio_v03";
let project={name:"Minha Visual Novel",scenes:[]};
let currentScene=0;

function blankScene(i){
 return {title:"Cena "+i,background:"",characters:[],dialogs:[]};
}
function init(){
 try{
  const x=localStorage.getItem(KEY);
  if(x) project=JSON.parse(x);
 }catch(e){}
 if(!project.scenes.length)project.scenes=[blankScene(1)];
 currentScene=Math.min(currentScene,project.scenes.length-1);
 render();
}
function saveProject(){
 project.name=document.getElementById("projectName").value||"Minha Visual Novel";
 localStorage.setItem(KEY,JSON.stringify(project));
 alert("Projeto salvo neste celular.");
}
function newProject(){
 if(!confirm("Criar um projeto novo? O projeto atual não será apagado do armazenamento até você confirmar uma nova gravação."))return;
 project={name:"Minha Visual Novel",scenes:[blankScene(1)]};
 currentScene=0;render();
}
function addScene(){
 project.scenes.push(blankScene(project.scenes.length+1));
 currentScene=project.scenes.length-1;render();
}
function deleteScene(){
 if(project.scenes.length===1){alert("O projeto precisa ter pelo menos uma cena.");return}
 project.scenes.splice(currentScene,1);
 currentScene=Math.max(0,currentScene-1);render();
}
function scene(){return project.scenes[currentScene]}
function fileToData(file,cb){
 if(!file)return;
 const r=new FileReader();
 r.onload=()=>cb(r.result);
 r.readAsDataURL(file);
}
function loadBackground(input){
 fileToData(input.files[0],data=>{scene().background=data;render()});
}
function loadCharacter(input){
 fileToData(input.files[0],data=>{
  scene().characters.push({src:data,pos:"center"});
  render();
 });
 input.value="";
}
function addDialogue(){
 const name=prompt("Nome do personagem:");
 if(name===null)return;
 const text=prompt("Texto do diálogo:");
 if(text===null)return;
 scene().dialogs.push({name:name||"Narrador",text});
 render();
}
function updateTitle(v){scene().title=v;render()}
function updateCharPos(i,v){scene().characters[i].pos=v;render()}
function removeChar(i){scene().characters.splice(i,1);render()}
function removeDialog(i){scene().dialogs.splice(i,1);render()}
function render(){
 document.getElementById("projectName").value=project.name;
 const s=scene();
 document.getElementById("sceneTitle").textContent=s.title;
 const list=document.getElementById("sceneList");
 list.innerHTML="";
 project.scenes.forEach((x,i)=>{
  const d=document.createElement("div");
  d.className="scene"+(i===currentScene?" active":"");
  d.innerHTML="<b>"+esc(x.title)+"</b><div class='muted'>"+x.dialogs.length+" diálogo(s)</div>";
  d.onclick=()=>{currentScene=i;render()};
  list.appendChild(d);
 });
 const stage=document.getElementById("stage");
 stage.style.backgroundImage=s.background?'url("'+s.background.replace(/"/g,'%22')+'")':'none';
 stage.innerHTML="";
 s.characters.forEach(c=>{
  const img=document.createElement("img");
  img.className="char "+(c.pos==="left"?"left":c.pos==="right"?"right":"centerPos");
  img.src=c.src;stage.appendChild(img);
 });
 if(s.dialogs.length){
  const d=s.dialogs[s.dialogs.length-1];
  const box=document.createElement("div");
  box.className="dialogBox";
  box.innerHTML="<b>"+esc(d.name)+"</b><br>"+esc(d.text);
  stage.appendChild(box);
 }
 const dl=document.getElementById("dialogList");
 dl.innerHTML="";
 if(!s.dialogs.length)dl.innerHTML="<div class='muted'>Nenhum diálogo. Você decide o que os personagens vão dizer.</div>";
 s.dialogs.forEach((d,i)=>{
  const el=document.createElement("div");
  el.className="item";
  el.style.marginBottom="8px";
  el.innerHTML="<b>"+esc(d.name)+"</b><br>"+esc(d.text)+"<br><br><button class='danger' onclick='removeDialog("+i+")'>Excluir</button>";
  dl.appendChild(el);
 });
 renderInspector();
}
function renderInspector(){
 const s=scene();
 let h="<label>Título da cena</label><input value='"+esc(s.title)+"' onchange='updateTitle(this.value)'>";
 h+="<hr><h3>Personagens</h3>";
 if(!s.characters.length)h+="<div class='muted'>Nenhum personagem.</div>";
 s.characters.forEach((c,i)=>{
  h+="<div class='item' style='margin-bottom:8px'>Personagem "+(i+1);
  h+="<select onchange='updateCharPos("+i+",this.value)'>";
  h+="<option value='left' "+(c.pos==="left"?"selected":"")+">Esquerda</option>";
  h+="<option value='center' "+(c.pos==="center"?"selected":"")+">Centro</option>";
  h+="<option value='right' "+(c.pos==="right"?"selected":"")+">Direita</option>";
  h+="</select><button class='danger' style='margin-top:8px' onclick='removeChar("+i+")'>Excluir</button></div>";
 });
 h+="<hr><div class='muted'>As imagens escolhidas ficam armazenadas no navegador deste aparelho. Para um projeto definitivo/exportável, adicionaremos o sistema de arquivos do projeto em uma próxima versão.</div>";
 document.getElementById("inspector").innerHTML=h;
}
function testProject(){
 const data=JSON.stringify(project);
 const blob=new Blob([`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste VN</title><style>
body{margin:0;background:#000;color:#fff;font-family:Arial}.screen{height:100vh;background:#111 center/cover no-repeat;position:relative}.c{position:absolute;bottom:110px;max-height:70%;max-width:35%;transform:translateX(-50%)}.l{left:22%}.m{left:50%}.r{left:78%}.box{position:absolute;left:4%;right:4%;bottom:20px;background:rgba(0,0,0,.82);padding:18px;border-radius:12px}</style></head><body><div id="s" class="screen"></div><script>
const p=${data};let i=0;function esc(x){return String(x||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\\"":"&quot;"}[c]))}function show(){const s=p.scenes[i],e=document.getElementById("s");e.style.backgroundImage=s.background?'url("'+s.background.replace(/"/g,"%22")+'")':"none";e.innerHTML="";s.characters.forEach(c=>{const im=document.createElement("img");im.src=c.src;im.className="c "+(c.pos==="left"?"l":c.pos==="right"?"r":"m");e.appendChild(im)});if(s.dialogs.length){const d=s.dialogs[0],b=document.createElement("div");b.className="box";b.innerHTML="<b>"+esc(d.name)+"</b><br>"+esc(d.text);e.appendChild(b)}e.onclick=()=>{if(s.dialogs.length){s.dialogs.shift();show()}else if(i<p.scenes.length-1){i++;show()}else alert("Fim do teste.")}}show();<\/script></body></html>`],{type:"text/html"});
 const url=URL.createObjectURL(blob);window.open(url,"_blank");
}
function esc(x){return String(x||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
init();
</script>
</body>
</html>
