<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VN Studio — Criador de Visual Novels</title>
<style>
:root{--bg:#10121a;--panel:#181b25;--panel2:#202432;--text:#f5f6fa;--muted:#a8afc0;--accent:#8b5cf6;--accent2:#6d28d9;--danger:#ef4444;--line:#303547}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:flex;flex-direction:column}.top{height:60px;background:#151821;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:10px;position:sticky;top:0;z-index:10}.logo{font-weight:800;font-size:18px;margin-right:auto}.logo span{color:#a78bfa}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:10px}.btn.primary{background:var(--accent);border-color:var(--accent)}.btn.danger{color:#fecaca;border-color:#7f1d1d;background:#2a171b}.main{display:grid;grid-template-columns:240px 1fr 300px;min-height:calc(100vh - 60px)}
aside,.inspector{background:var(--panel);padding:14px;border-right:1px solid var(--line)}.inspector{border-right:0;border-left:1px solid var(--line)}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 10px}.project-title{font-size:18px;font-weight:700;margin-bottom:14px}.scene-list{display:flex;flex-direction:column;gap:7px}.scene-item{display:flex;align-items:center;gap:7px}.scene-item button:first-child{flex:1;text-align:left}.scene-item .active{background:#31245b;border-color:#6d4bd8}
.editor{padding:16px;min-width:0}.stage-wrap{background:#0b0d12;border:1px solid var(--line);border-radius:14px;padding:10px}.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:linear-gradient(135deg,#2b3448,#111827);background-size:cover;background-position:center}
.stage.empty:after{content:"Pré-visualização da cena";position:absolute;inset:0;display:grid;place-items:center;color:#8991a4;font-weight:600}
.character{position:absolute;bottom:0;max-width:38%;max-height:82%;object-fit:contain;filter:drop-shadow(0 8px 10px #0008)}.char-left{left:6%}.char-center{left:50%;transform:translateX(-50%)}.char-right{right:6%}
.dialogue{position:absolute;left:4%;right:4%;bottom:4%;background:#0b0d12dd;border:1px solid #ffffff22;border-radius:10px;padding:10px 13px}.speaker{font-weight:800;color:#c4b5fd;font-size:13px;margin-bottom:3px}.line{font-size:15px;line-height:1.35}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}.field{display:flex;flex-direction:column;gap:6px;margin:9px 0}.field label{font-size:12px;color:var(--muted)}input,textarea,select{width:100%;background:#10131b;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px}textarea{min-height:80px;resize:vertical}.row{display:flex;gap:7px}.row>*{flex:1}.empty-note{color:var(--muted);font-size:13px;line-height:1.45}
.dialogue-list{display:flex;flex-direction:column;gap:7px;margin-top:8px}.dialogue-row{display:flex;gap:8px;align-items:center;background:#12151e;border:1px solid var(--line);padding:8px;border-radius:9px}.dialogue-row small{color:#a78bfa;width:70px}.dialogue-row span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:900px){.main{grid-template-columns:190px 1fr}.inspector{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}
@media(max-width:600px){.main{grid-template-columns:1fr}.top{height:auto;min-height:60px;flex-wrap:wrap;padding:10px}.logo{width:100%}.stage-wrap{padding:6px}.editor{padding:9px}aside{border-right:0;border-bottom:1px solid var(--line)}}

.library{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.asset{background:#10131b;border:1px solid var(--line);border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:6px}.asset img{width:100%;height:90px;object-fit:contain;background:#0b0d12;border-radius:6px}.asset b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset-actions{display:flex;gap:5px}.asset-actions button{flex:1;padding:6px;font-size:11px}.file{display:none}.char-tag{position:absolute;top:7px;right:7px;background:#000b;padding:4px 7px;border-radius:7px;font-size:10px;color:#ddd}

</head>
<body>
<div class="app">
<header class="top">
  <div class="logo">VN <span>Studio</span></div>
  <button class="btn" onclick="newProject()">Novo projeto</button>
  <button class="btn" onclick="saveProject()">💾 Salvar</button>
  <button class="btn primary" onclick="playProject()">▶ Testar</button>
</header>
<div class="main">
<aside>
  <div class="project-title" id="projectName">Minha Visual Novel</div>
  <button class="btn primary" style="width:100%;margin-bottom:12px" onclick="addScene()">＋ Nova cena</button>
  <h3>Cenas</h3><div class="scene-list" id="sceneList"></div>
</aside>

<section class="editor">
  <div class="stage-wrap"><div class="stage" id="stage"></div></div>
  <div class="toolbar">
    <button class="btn" onclick="setBackground()">🖼️ Fundo</button>
    <button class="btn" onclick="addCharacter()">👤 Personagem</button>
    <button class="btn" onclick="addDialogue()">💬 Diálogo</button><button class="btn" onclick="addExpressionToCharacter()">🎭 Pose/expressão</button>
    <button class="btn danger" onclick="deleteScene()">Excluir cena</button>
  </div>
  <div class="card">
    <h3>Diálogos da cena</h3>
    <div id="dialogueList" class="dialogue-list"></div>
  </div>
</section>

<aside class="inspector">
  <h3>Projeto</h3>
  <div class="field"><label>Nome</label><input id="projectInput" oninput="project.name=this.value;render()" value="Minha Visual Novel"></div>
  <h3>Cena</h3>
  <div class="field"><label>Título</label><input id="sceneTitle" oninput="current().title=this.value;render()" placeholder="Ex.: Chegada à cidade"></div>
  <div class="field"><label>URL do fundo</label><input id="bgInput" oninput="current().background=this.value;renderStage()" placeholder="https://.../imagem.jpg"></div>
  <div class="card">
<h3>Biblioteca</h3>
<div class="row">
<button class="btn" onclick="addAssetFromFile('character')">＋ Personagem</button>
<button class="btn" onclick="addAssetFromFile('background')">＋ Fundo</button>
</div>
<div id="assets" class="library" style="margin-top:8px"></div>
<p class="empty-note">As imagens escolhidas ficam salvas dentro do projeto neste navegador.</p>
</div>
</aside>
</div>
</div>

<script>
let project={name:"Minha Visual Novel",scenes:[],assets:[]}, selected=0, editingAsset=null;

function current(){return project.scenes[selected]}
function newProject(){
 if(!confirm("Criar um projeto novo? O projeto atual só será mantido se você já tiver salvo/baixado."))return;
 project={name:"Minha Visual Novel",scenes:[scene("Cena 1")],assets:[]};selected=0;render();
}
function scene(title){return {title,background:"",characters:[],dialogues:[]}}
function addScene(){project.scenes.push(scene("Cena "+(project.scenes.length+1)));selected=project.scenes.length-1;render()}
function deleteScene(){
 if(project.scenes.length<=1){alert("O projeto precisa ter pelo menos uma cena.");return}
 project.scenes.splice(selected,1);selected=Math.max(0,selected-1);render()
}
function setBackground(){
 const url=prompt("Cole a URL de uma imagem de fundo:");
 if(url!==null){current().background=url;render()}
}
function addCharacter(){
 const assets=(project.assets||[]).filter(a=>a.type==="character");
 if(!assets.length){
   alert("Primeiro adicione um personagem na Biblioteca abaixo.");
   document.getElementById("assetFile").click();
   return;
 }
 const names=assets.map((a,i)=>`${i+1}. ${a.name}`).join("\n");
 const n=prompt("Escolha o personagem pelo número:\n\n"+names,"1");
 if(n===null)return;
 const a=assets[Number(n)-1]; if(!a)return;
 const pos=prompt("Posição: esquerda, centro ou direita","centro")||"centro";
 const expression=prompt("Expressão/pose (opcional):","normal")||"normal";
 current().characters.push({assetId:a.id,pos,expression});render()
}
function addDialogue(){
 const speaker=prompt("Nome do personagem:","Narrador"); if(speaker===null)return;
 const text=prompt("Fala:","Olá! Esta é minha visual novel."); if(text===null)return;
 current().dialogues.push({speaker,text});render()
}

function addAssetFromFile(type){
 const input=document.getElementById("assetFile");
 input.value="";
 input.onchange=()=>{
   const file=input.files[0]; if(!file)return;
   const reader=new FileReader();
   reader.onload=()=>{
     project.assets=project.assets||[];
     const name=prompt("Nome deste arquivo:",file.name.replace(/\.[^.]+$/,""))||file.name;
     project.assets.push({id:Date.now()+"_"+Math.random().toString(16).slice(2),name,type,data:reader.result});
     render();
   };
   reader.readAsDataURL(file);
 };
 input.click();
}
function removeAsset(id){
 project.assets=(project.assets||[]).filter(a=>a.id!==id);
 project.scenes.forEach(s=>s.characters=s.characters.filter(c=>c.assetId!==id));
 render();
}
function addExpressionToCharacter(){
 const chars=current().characters;
 if(!chars.length){alert("Adicione um personagem primeiro.");return}
 const list=chars.map((c,i)=>`${i+1}. ${assetName(c.assetId)} — ${c.expression||"normal"}`).join("\n");
 const n=prompt("Qual personagem?\n\n"+list,"1");if(n===null)return;
 const c=chars[Number(n)-1];if(!c)return;
 c.expression=prompt("Nome da expressão/pose:",c.expression||"normal")||c.expression||"normal";
 render();
}
function assetName(id){const a=(project.assets||[]).find(x=>x.id===id);return a?a.name:"Personagem"}
function renderAssets(){
 const box=document.getElementById("assets");if(!box)return;
 box.innerHTML="";
 (project.assets||[]).forEach(a=>{
   const d=document.createElement("div");d.className="asset";
   d.innerHTML=`<img src="${a.data}" alt=""><b>${escapeHtml(a.name)}</b><small style="color:#a8afc0">${a.type==="character"?"Personagem":"Fundo"}</small>
   <div class="asset-actions"><button class="btn" onclick="useAsset('${a.id}')">Usar</button><button class="btn danger" onclick="removeAsset('${a.id}')">×</button></div>`;
   box.appendChild(d);
 });
}
function useAsset(id){
 const a=(project.assets||[]).find(x=>x.id===id);if(!a)return;
 if(a.type==="background"){current().background=a.data}
 else {current().characters.push({assetId:a.id,pos:"centro",expression:"normal"})}
 render();
}
function saveProject(){
 localStorage.setItem("vnStudioProject",JSON.stringify(project));
 alert("Projeto salvo neste navegador!");
}
function loadProject(){
 try{let x=localStorage.getItem("vnStudioProject");if(x)project=JSON.parse(x)}catch(e){}
 if(!project.scenes.length)project.scenes=[scene("Cena 1")]; if(!project.assets)project.assets=[];
}
function render(){
 document.getElementById("projectName").textContent=project.name;
 document.getElementById("projectInput").value=project.name;
 const list=document.getElementById("sceneList");list.innerHTML="";
 project.scenes.forEach((s,i)=>{
   const d=document.createElement("div");d.className="scene-item";
   d.innerHTML=`<button class="btn ${i===selected?'active':''}" onclick="selected=${i};render()">${i+1}. ${escapeHtml(s.title)}</button>`;
   list.appendChild(d)
 });
 document.getElementById("sceneTitle").value=current().title;
 document.getElementById("bgInput").value=current().background;
 renderStage();renderDialogues();renderAssets()
}
function renderStage(){
 const s=current(),stage=document.getElementById("stage");stage.innerHTML="";
 stage.className="stage"+(s.background?"":" empty");
 if(s.background)stage.style.backgroundImage=`url("${cssUrl(s.background)}")`;else stage.style.backgroundImage="";
 s.characters.forEach(c=>{
   const a=(project.assets||[]).find(x=>x.id===c.assetId);
   const img=document.createElement("img");img.className="character "+({"esquerda":"char-left","centro":"char-center","direita":"char-right"}[c.pos]||"char-center");
   img.src=a?a.data:c.url||"";img.onerror=()=>img.style.display="none";stage.appendChild(img);
   if(a){const tag=document.createElement("div");tag.className="char-tag";tag.textContent=a.name+" · "+(c.expression||"normal");stage.appendChild(tag)}
 });
 const d=s.dialogues[s.dialogues.length-1];
 if(d){const box=document.createElement("div");box.className="dialogue";box.innerHTML=`<div class="speaker">${escapeHtml(d.speaker)}</div><div class="line">${escapeHtml(d.text)}</div>`;stage.appendChild(box)}
}
function renderDialogues(){
 const el=document.getElementById("dialogueList");el.innerHTML="";
 current().dialogues.forEach((d,i)=>{
  const row=document.createElement("div");row.className="dialogue-row";
  row.innerHTML=`<small>${escapeHtml(d.speaker)}</small><span>${escapeHtml(d.text)}</span><button class="btn" onclick="editDialogue(${i})">Editar</button><button class="btn danger" onclick="removeDialogue(${i})">×</button>`;
  el.appendChild(row)
 })
}
function editDialogue(i){
 const d=current().dialogues[i],speaker=prompt("Nome:",d.speaker);if(speaker===null)return;
 const text=prompt("Fala:",d.text);if(text===null)return;
 d.speaker=speaker;d.text=text;render()
}
function removeDialogue(i){current().dialogues.splice(i,1);render()}
function playProject(){
 const win=window.open("","_blank");
 if(!win){alert("Permita pop-ups para testar a visual novel.");return}
 const safeProject=JSON.stringify(project).replace(/</g,"\\u003c");
 const playCode=`let p=${safeProject},si=0,di=0;
 function r(){
   let c=p.scenes[si],s=document.getElementById('s');
   s.style.backgroundImage=c.background?'url("'+c.background+'")':'linear-gradient(135deg,#334155,#111827)';
   let d=c.dialogues[di];
   document.getElementById('d')?.remove();
   if(d){
     let x=document.createElement('div');
     x.id='d';
     x.innerHTML='<div id="n">'+d.speaker+'</div><div>'+d.text+'</div><button onclick="next()">Continuar</button>';
     document.body.appendChild(x);
   }else if(si<p.scenes.length-1){
     si++;di=0;r();
   }else{
     s.innerHTML='<div style="display:grid;place-items:center;height:100%;font-size:28px">Fim da demonstração</div>';
   }
 }
 function next(){di++;r()} r();`;
 win.document.open();
 win.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+escapeHtml(project.name)+'</title><style>body{margin:0;background:#000;color:#fff;font-family:system-ui}#s{height:100vh;background-size:cover;background-position:center;position:relative}#d{position:absolute;left:5%;right:5%;bottom:5%;padding:18px;background:#000c;border-radius:12px}#n{font-weight:800;color:#c4b5fd}button{padding:10px 15px;border-radius:8px;border:0;margin-top:8px}</style></head><body><div id="s"></div>');
 win.document.write('<scr'+'ipt>'+playCode+'<\/scr'+'ipt>');
 win.document.write('</body></html>');
 win.document.close();
}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function cssUrl(x){return String(x).replace(/"/g,'%22')}
loadProject();render();
</script>
</body>
</html>
