<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eclipse — Histórias que ganham vida</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08060d;color:#f8f2ff;font-family:Arial,sans-serif}.app{max-width:480px;margin:auto;min-height:100vh;background:linear-gradient(#170d22,#09070d);padding-bottom:78px}.top{height:70px;padding:12px 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #30213c;position:sticky;top:0;background:#120b19ee;z-index:5}.brand{font-size:22px;font-weight:800}.sub{font-size:9px;color:#a99cad}.coin{background:#251631;border:1px solid #503464;border-radius:18px;padding:8px 11px}.screen{padding:19px 16px}.hero,.box{background:#16101d;border:1px solid #382744;border-radius:20px;padding:17px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#3b2050,#18101f)}h1{font-size:27px;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}h3{margin:0 0 7px}.muted{color:#aaa0b1;font-size:13px;line-height:1.5}.btn{background:#b96df2;color:white;border:0;border-radius:13px;padding:11px 15px;font-weight:bold;cursor:pointer}.dark{background:#261731;border:1px solid #4b345b}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.cards{display:flex;gap:10px;overflow:auto}.card{min-width:145px;height:165px;border:1px solid #483051;border-radius:18px;padding:13px;background:linear-gradient(145deg,#39204b,#17101e);display:flex;flex-direction:column;justify-content:end}.emoji{font-size:43px;margin-bottom:auto}.input{width:100%;padding:12px;border-radius:12px;background:#0d0911;color:white;border:1px solid #3b2a45;margin:5px 0 10px}.chat{display:flex;flex-direction:column;gap:10px}.bubble{padding:13px;border-radius:17px;max-width:84%;line-height:1.45}.ai{background:#251731}.me{background:#7844a2;align-self:flex-end}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:78px;background:#100a15f7;border-top:1px solid #30213c;display:flex;justify-content:space-around;padding-top:8px;z-index:10}.nav button{background:none;border:0;color:#84788d;font-size:19px;cursor:pointer}.nav button span{display:block;font-size:9px;margin-top:3px}.nav .on{color:#d79cff}.pill{display:inline-block;background:#251832;color:#d9a9fa;border-radius:15px;padding:5px 8px;font-size:10px;margin:2px}
</style></head><body><div class="app">
<header class="top"><div><div class="brand">◐ Eclipse</div><div class="sub">Desenvolvido por Bieel</div></div><div class="coin">🌙 <b>120</b></div></header>
<main id="s" class="screen"></main>
<nav class="nav"><button onclick="go('home')" id="n-home">⌂<span>Início</span></button><button onclick="go('discover')" id="n-discover">⌕<span>Descobrir</span></button><button onclick="go('create')" id="n-create">＋<span>Criar</span></button><button onclick="go('chat')" id="n-chat">♡<span>Chats</span></button><button onclick="go('profile')" id="n-profile">●<span>Perfil</span></button></nav>
</div>
<script>
const s=document.getElementById("s");
let messages=[];
function go(p){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));let n=document.getElementById("n-"+p);if(n)n.classList.add("on");
const P={
home:`<div class="hero"><h1>Seu universo começa aqui.</h1><p class="muted">Converse com personagens de IA, viva histórias e crie seus próprios universos.</p><button class="btn" onclick="go('discover')">Descobrir histórias</button></div><h2>🔥 Em alta</h2><div class="cards"><div class="card"><div class="emoji">🌧️</div><b>A Garota da Chuva</b><small class="muted">Romance · 12,4 mil</small></div><div class="card"><div class="emoji">🗡️</div><b>Reino de Ébano</b><small class="muted">Fantasia · 8,7 mil</small></div><div class="card"><div class="emoji">🚀</div><b>Órbita 09</b><small class="muted">Sci-fi · 5,2 mil</small></div></div><div class="box" style="margin-top:17px"><h3>🌙 Luna</h3><p class="muted">Carinhosa · misteriosa · protetora</p><button class="btn" onclick="go('chat')">Conversar agora</button></div>`,
discover:`<h1>Descobrir</h1><input class="input" placeholder="🔎 Buscar histórias, personagens ou criadores"><div class="pill">🔥 Em alta</div><div class="pill">🆕 Novos</div><div class="pill">❤️ Romance</div><div class="box" style="margin-top:15px"><h3>🌧️ A Garota da Chuva</h3><p class="muted">Uma noite muda tudo.</p><span class="pill">❤️ 12k</span><span class="pill">💬 1,8k</span><br><button class="btn" onclick="go('chat')" style="margin-top:10px">Viver história</button></div><div class="box"><h3>👥 Criadores em destaque</h3><p class="muted">@EclipseCreator · 24 mil seguidores</p><button class="btn dark">Seguir</button></div>`,
create:`<h1>✨ Criar</h1><p class="muted">A IA ajuda. Você decide o universo.</p><div class="box"><h3>🎭 Personagem</h3><input class="input" placeholder="Nome"><input class="input" placeholder="Personalidade"><textarea class="input" rows="3" placeholder="História e jeito de falar"></textarea><button class="btn" onclick="alert('Rascunho criado!')">Criar com IA</button></div><div class="box"><h3>📖 História</h3><input class="input" placeholder="Título"><input class="input" placeholder="Gênero"><textarea class="input" rows="3" placeholder="Descreva sua ideia"></textarea><button class="btn" onclick="alert('História salva como rascunho!')">Gerar história</button></div>`,
chat:`<div class="row"><h1>🌙 Luna</h1><span class="pill">IA</span></div><p class="muted">Memória da história ativa.</p><div id="messages" class="chat">${messages.map(m=>`<div class="bubble ${m.role==='user'?'me':'ai'}">${escapeHtml(m.text)}</div>`).join("")}</div><div class="box" style="margin-top:14px"><input id="msg" class="input" placeholder="Escreva para Luna..." onkeydown="if(event.key==='Enter')send()"><button id="send" class="btn" style="width:100%" onclick="send()">Enviar</button></div>`,
profile:`<h1>Perfil</h1><div class="box"><h2>Meu perfil</h2><p class="muted">Criador no Eclipse</p><p>👥 0 seguidores · ❤️ 0 curtidas · 📖 0 histórias</p></div><div class="box"><h3>🌙 Eclipse Coins</h3><h1>120</h1><button class="btn dark" onclick="alert('+10 moedas!')">🎁 Assistir anúncio · +10</button></div><div class="box"><h3>⭐ Eclipse+</h3><p class="muted">Sem anúncios, mais memória, voz, imagens e modelos melhores.</p><button class="btn">Conhecer Eclipse+</button></div>`
};s.innerHTML=P[p]||P.home}
function escapeHtml(x){return x.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
async function send(){const input=document.getElementById("msg");if(!input||!input.value.trim())return;const text=input.value.trim();input.value="";messages.push({role:"user",text});go("chat");const btn=document.getElementById("send");btn.disabled=true;btn.textContent="Luna está pensando...";try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sessionId:"demo-session",message:text})});const d=await r.json();if(!r.ok)throw Error(d.error||"Erro");messages.push({role:"assistant",text:d.reply});}catch(e){messages.push({role:"assistant",text:"Estou em modo de demonstração. Quando o backend estiver configurado, vou responder de verdade. 🌙"});}go("chat")}
go("home");
</script></body></html>
